name = "wedding-invitation"
main = "src/entry.js"
compatibility_date = "2026-10-01"

# Local KV works with this placeholder. Replace id with the real production
# namespace ID before deploy; this is not a secret or an existing namespace.
[[kv_namespaces]]
binding = "INVITATIONS"
id = "00000000000000000000000000000000"

[vars]
SITE_URL = "https://datct269.github.io/wedding-invitation/"
LOCAL_SITE_URL = "http://localhost:5173/"

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = true

[[rules]]
type = "Text"
globs = ["**/*.svg"]
fallthrough = true
